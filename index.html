        const galleryExamples = [
          { img: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400&q=80", title: "ไซเบอร์พังก์" },

        function App() {
          const [appState, setAppState] = useState('home'); 
          const [imageSrc, setImageSrc] = useState(null);
          const [fileName, setFileName] = useState('');
          const [activeTab, setActiveTab] = useState('adjust');
          const [isProcessing, setIsProcessing] = useState(false);
          const [showPanels, setShowPanels] = useState(true);

          // ระบบแจ้งเตือน Custom Modal
          const [alertMsg, setAlertMsg] = useState('');
          const [showExitConfirm, setShowExitConfirm] = useState(false);

          // ==========================================
          // Photobooth State
          // ==========================================
          const [boothMode, setBoothMode] = useState('camera');
          const [boothLayout, setBoothLayout] = useState('single'); 
          const [filmImages, setFilmImages] = useState([null, null, null]);
          const [activeFilmSlot, setActiveFilmSlot] = useState(0);
          const [boothTone, setBoothTone] = useState('none');
          const boothFileInputRef = useRef(null);

          const boothTones = {
            none: { label: 'ออริจินัล', filter: 'none' },
            film: { label: 'ฟิล์ม 90s', filter: 'sepia(30%) contrast(120%) brightness(110%) hue-rotate(-10deg)' },
            y2k: { label: 'Y2K กลิทช์', filter: 'saturate(150%) contrast(110%) brightness(115%) hue-rotate(-30deg)' },
            bw: { label: 'ขาวดำดาร์ค', filter: 'grayscale(100%) contrast(150%) brightness(90%)' },
            vintage: { label: 'วินเทจ', filter: 'sepia(60%) contrast(110%) brightness(95%) blur(0.5px)' },
            cyber: { label: 'ไซเบอร์พังก์', filter: 'saturate(200%) hue-rotate(90deg) contrast(110%)' },
            faded: { label: 'โลไฟ', filter: 'contrast(80%) brightness(110%) sepia(50%) blur(1px)' }
          };

          // ==========================================
          // Editor State
          // ==========================================
          const defaultFilters = { brightness: 100, contrast: 100, saturation: 100, grayscale: 0, sepia: 0, blur: 0, hueRotate: 0, invert: 0, vignette: 0, noise: 0 };
          const [filters, setFilters] = useState(defaultFilters);
          const defaultTransform = { rotate: 0, flipX: 1, flipY: 1 };
          const [transform, setTransform] = useState(defaultTransform);
          const defaultText = { top: '', bottom: '', color: '#ffffff', outline: '#000000' };
          const [textConfig, setTextConfig] = useState(defaultText);
          const defaultCrop = { top: 0, bottom: 0, left: 0, right: 0 };
          const [crop, setCrop] = useState(defaultCrop);
          
          const [stickers, setStickers] = useState([]);
          const [activeSticker, setActiveSticker] = useState(null);
          const [history, setHistory] = useState([]);

          // ==========================================
          // Interactive Crop State
          // ==========================================
          const [cropMode, setCropMode] = useState('drag'); 
          const [draggingCrop, setDraggingCrop] = useState(null);

          // ==========================================
          // Logic Functions
          // ==========================================
          const takeSnapshot = () => {
            setHistory(prev => [...prev, {
              filters: { ...filters },
              transform: { ...transform },
              textConfig: { ...textConfig },
              crop: { ...crop },
              stickers: JSON.parse(JSON.stringify(stickers)), 
              imageSrc: imageSrc 
            }].slice(-20));
          };

          const undo = () => {
            if (history.length > 0) {
              const lastState = history[history.length - 1];
              setFilters(lastState.filters);
              setTransform(lastState.transform);
              setTextConfig(lastState.textConfig);
              setCrop(lastState.crop);
              setStickers(lastState.stickers);
              setImageSrc(lastState.imageSrc);
              setHistory(prev => prev.slice(0, -1));
              setActiveSticker(null);
            }
          };

          const resetAll = (hardReset = false) => {
            if (!hardReset) takeSnapshot();
            setFilters(defaultFilters);
            setTransform(defaultTransform);
            setTextConfig(defaultText);
            setCrop(defaultCrop);
            setStickers([]);
            setActiveSticker(null);
            if (hardReset) setHistory([]);
          };

          const confirmExit = () => {
            setImageSrc(null);
            setAppState('home');
            setShowExitConfirm(false);
          };

          // ==========================================
          // Home & File Logic
          // ==========================================
          const fileInputRef = useRef(null);

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              setFileName(file.name.split('.').slice(0, -1).join('.'));
              const reader = new FileReader();
              reader.onload = (event) => {
                setImageSrc(event.target.result);
                resetAll(true);
                setAppState('editor');
              };
              reader.readAsDataURL(file);
            }
          };

          // ==========================================
          // Photobooth Logic
          // ==========================================
          const videoRef = useRef(null);
          const [stream, setStream] = useState(null);

          const openPhotobooth = async () => {
            setAppState('photobooth');
            setBoothMode('camera');
            setBoothLayout('single');
            setFilmImages([null, null, null]);
            setActiveFilmSlot(0);
            setBoothTone('none');
            try {
              const mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
              setStream(mediaStream);
            } catch (err) {
              setAlertMsg("ไม่สามารถเข้าถึงกล้องได้ ระบบจะสลับไปใช้โหมดเลือกรูปภาพแทนนะ");
              setBoothMode('upload');
            }
          };

          const closePhotobooth = () => {
            if (stream) stream.getTracks().forEach(track => track.track && track.stop());
            setAppState('home');
          };

          const captureBooth = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const processCapture = (sourceImg, isVideo = false) => {
              canvas.width = isVideo ? sourceImg.videoWidth : sourceImg.naturalWidth;
              canvas.height = isVideo ? sourceImg.videoHeight : sourceImg.naturalHeight;
              ctx.filter = boothTones[boothTone].filter;
              if (isVideo) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
              }
              ctx.drawImage(sourceImg, 0, 0, canvas.width, canvas.height);
              return canvas.toDataURL('image/jpeg', 0.95);
            };

            if (boothLayout === 'single') {
              if (boothMode === 'camera' && videoRef.current) {
                setImageSrc(processCapture(videoRef.current, true));
              } else if (boothMode === 'upload' && filmImages[0]) {
                const img = new Image();
                img.onload = () => {
                  setImageSrc(processCapture(img));
                  finishBooth('Uploaded_Photo');
                };
                img.src = filmImages[0];
                return;
              }
              finishBooth('Photobooth_' + new Date().getTime());

            } else {
              if (boothMode === 'camera' && videoRef.current) {
                const newImgs = [...filmImages];
                newImgs[activeFilmSlot] = processCapture(videoRef.current, true);
                setFilmImages(newImgs);
                if (activeFilmSlot < 2) setActiveFilmSlot(p => p + 1);
              }
            }
          };

          const generateFilmStrip = async () => {
            setIsProcessing(true);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const loadImg = (src) => new Promise(resolve => {
              if (!src) resolve(null);
              const img = new Image();
              img.onload = () => resolve(img);
              img.src = src;
            });

            const imgs = await Promise.all(filmImages.map(loadImg));
            const validImgs = imgs.filter(img => img !== null);
            if (validImgs.length === 0) { setIsProcessing(false); return; }

            const imgW = validImgs[0].naturalWidth;
            const imgH = validImgs[0].naturalHeight;
            const padding = imgW * 0.1; 
            const holeSize = padding * 0.4;
            
            canvas.width = imgW + (padding * 2);
            canvas.height = (imgH * validImgs.length) + (padding * (validImgs.length + 1));

            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            const numHoles = Math.floor(canvas.height / (holeSize * 2));
            for (let i = 0; i < numHoles; i++) {
              const y = (i * holeSize * 2) + holeSize;
              ctx.fillRect(padding * 0.2, y, holeSize, holeSize);
              ctx.fillRect(canvas.width - (padding * 0.2) - holeSize, y, holeSize, holeSize);
            }

            validImgs.forEach((img, index) => {
              const y = padding + (index * (imgH + padding));
              ctx.drawImage(img, padding, y, imgW, imgH);
            });

            setImageSrc(canvas.toDataURL('image/jpeg', 0.95));
            finishBooth('FilmStrip_' + new Date().getTime());
            setIsProcessing(false);
          };

          const finishBooth = (name) => {
            if (!fileName) setFileName(name);
            if (stream) stream.getTracks().forEach(track => track.stop());
            resetAll(true);
            setAppState('editor');
          };

          const handleBoothUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (event) => {
                const newImgs = [...filmImages];
                newImgs[activeFilmSlot] = event.target.result;
                setFilmImages(newImgs);
                if (boothLayout === 'film' && activeFilmSlot < 2) setActiveFilmSlot(p => p + 1);
                if (stream && boothLayout === 'single') stream.getTracks().forEach(track => track.stop());
              };
              reader.readAsDataURL(file);
            }
          };

          useEffect(() => {
            if (appState === 'photobooth' && boothMode === 'camera' && videoRef.current && stream) {
              videoRef.current.srcObject = stream;
            }
          }, [appState, stream, boothMode, activeFilmSlot]);

          // ==========================================
          // Editor Interactive Tools
          // ==========================================
          const applyPreset = (presetConfig) => {
            takeSnapshot();
            setFilters({ ...defaultFilters, ...presetConfig });
          };
          
          const handleFilterChange = (filterName, value) => {
            setFilters(prev => ({ ...prev, [filterName]: value }));
          };
          
          const handleCropChange = (side, value) => {
            setCrop(prev => ({ ...prev, [side]: value }));
          };

          // Sticker Handlers
          const addSticker = (type) => {
            takeSnapshot();
            setStickers(prev => [...prev, {
              id: Date.now(),
              type: type,
              color: '#facc15',
              x: 50, y: 50, size: 80
            }]);
          };

          const removeSticker = (id) => {
            takeSnapshot();
            setStickers(prev => prev.filter(s => s.id !== id));
            if (activeSticker === id) setActiveSticker(null);
          };

          const previewRef = useRef(null);
          const handlePointerDown = (e, id) => {
            setActiveSticker(id);
            e.target.setPointerCapture(e.pointerId);
          };
          
          const handlePointerMove = (e) => {
            if (!activeSticker || !previewRef.current) return;
            const rect = previewRef.current.getBoundingClientRect();
            const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((e.clientY - rect.top) / rect.height) * 100;
            setStickers(prev => prev.map(s => 
              s.id === activeSticker ? { ...s, x: Math.max(0, Math.min(100, xPercent)), y: Math.max(0, Math.min(100, yPercent)) } : s
            ));
          };
          
          const handlePointerUp = (e) => {
            if (activeSticker) {
              takeSnapshot();
              e.target.releasePointerCapture(e.pointerId);
            }
          };

          // Crop Interactive Handlers
          const handleCropDragStart = (e, edge) => {
            e.stopPropagation();
            setDraggingCrop(edge);
            e.target.setPointerCapture(e.pointerId);
            takeSnapshot(); 
          };

          const handleCropDragMove = (e) => {
            if (!draggingCrop || !previewRef.current) return;
            const rect = previewRef.current.getBoundingClientRect();
            const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

            setCrop(prev => {
              const newCrop = { ...prev };
              if (draggingCrop === 'top') newCrop.top = Math.max(0, Math.min(yPercent, 45, 100 - prev.bottom - 10));
              if (draggingCrop === 'bottom') newCrop.bottom = Math.max(0, Math.min(100 - yPercent, 45, 100 - prev.top - 10));
              if (draggingCrop === 'left') newCrop.left = Math.max(0, Math.min(xPercent, 45, 100 - prev.right - 10));
              if (draggingCrop === 'right') newCrop.right = Math.max(0, Math.min(100 - xPercent, 45, 100 - prev.left - 10));
              return newCrop;
            });
          };

          const handleCropDragEnd = (e) => {
            if (draggingCrop) {
              setDraggingCrop(null);
              e.target.releasePointerCapture(e.pointerId);
            }
          };

          // ==========================================
          // AI Tools Logic
          // ==========================================
          const removeBackground = () => {
            takeSnapshot();
            setIsProcessing(true);
            setTimeout(() => {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              const img = new Image();
              img.onload = () => {
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                ctx.drawImage(img, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const bgR = data[0], bgG = data[1], bgB = data[2];
                const tolerance = 60;

                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i], g = data[i + 1], b = data[i + 2];
                  const dist = Math.sqrt(Math.pow(r - bgR, 2) + Math.pow(g - bgG, 2) + Math.pow(b - bgB, 2));
                  if (dist < tolerance) {
                    data[i + 3] = 0;
                  }
                }
                
                ctx.putImageData(imageData, 0, 0);
                setImageSrc(canvas.toDataURL('image/png'));
                setIsProcessing(false);
              };
              img.src = imageSrc;
            }, 800);
          };

          const runAIEnhance = () => {
            takeSnapshot();
            setIsProcessing(true);
            setTimeout(() => {
              setFilters({ ...defaultFilters, brightness: 110, contrast: 125, saturation: 130 });
              setIsProcessing(false);
            }, 800);
          };

          // ==========================================
          // Download logic (Rendering with Effects)
          // ==========================================
          const downloadImage = () => {
            if (!imageSrc) return;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = () => {
              const isRotated = (transform.rotate / 90) % 2 !== 0;
              let naturalW = isRotated ? img.naturalHeight : img.naturalWidth;
              let naturalH = isRotated ? img.naturalWidth : img.naturalHeight;

              const cropW = naturalW * (1 - (crop.left + crop.right) / 100);
              const cropH = naturalH * (1 - (crop.top + crop.bottom) / 100);
              
              canvas.width = cropW;
              canvas.height = cropH;

              ctx.save();
              ctx.translate(canvas.width / 2, canvas.height / 2);
              
              ctx.filter = `brightness(${filters.brightness}%) contrast(${filters.contrast}%) saturate(${filters.saturation}%) grayscale(${filters.grayscale}%) sepia(${filters.sepia}%) blur(${filters.blur}px) hue-rotate(${filters.hueRotate}deg) invert(${filters.invert}%)`;
              ctx.rotate((transform.rotate * Math.PI) / 180);
              ctx.scale(transform.flipX, transform.flipY);
              
              const drawX = -img.naturalWidth / 2 + (img.naturalWidth * (crop.right - crop.left) / 200);
              const drawY = -img.naturalHeight / 2 + (img.naturalHeight * (crop.bottom - crop.top) / 200);
              ctx.drawImage(img, drawX, drawY);

              const displayW = previewRef.current?.offsetWidth || img.naturalWidth;
              const scaleRatio = img.naturalWidth / displayW;

              stickers.forEach(s => {
                const px = drawX + img.naturalWidth * (s.x / 100);
                const py = drawY + img.naturalHeight * (s.y / 100);
                const sSize = s.size * scaleRatio; 
                
                ctx.save();
                ctx.translate(px, py);
                ctx.scale(sSize / 24, sSize / 24);
                ctx.translate(-12, -12);
                
                const path = new Path2D(stickerIcons[s.type]);
                ctx.fillStyle = '#000000';
                ctx.translate(2, 2);
                ctx.fill(path);
                ctx.translate(-2, -2);
                
                ctx.fillStyle = s.color;
                ctx.fill(path);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke(path);
                ctx.restore();
              });

              if (textConfig.top || textConfig.bottom) {
                const fontSize = Math.max(20, Math.floor(img.naturalWidth * 0.08)); 
                ctx.font = `900 ${fontSize}px 'Kanit', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineWidth = fontSize * 0.15;
                ctx.lineJoin = 'round';

                const drawMemeText = (text, x, y) => {
                  if (!text) return;
                  ctx.strokeStyle = textConfig.outline;
                  ctx.strokeText(text.toUpperCase(), x, y);
                  ctx.fillStyle = textConfig.color;
                  ctx.fillText(text.toUpperCase(), x, y);
                };

                const textX = drawX + img.naturalWidth / 2;
                drawMemeText(textConfig.top, textX, drawY + img.naturalHeight * 0.15);
                drawMemeText(textConfig.bottom, textX, drawY + img.naturalHeight * 0.85);
              }

              ctx.restore();

              if (filters.vignette > 0) {
                const radius = Math.max(canvas.width, canvas.height) * 0.6;
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const gradient = ctx.createRadialGradient(cx, cy, radius * 0.4, cx, cy, radius * 1.5);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, `rgba(0,0,0,${filters.vignette / 100})`);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              }

              if (filters.noise > 0) {
                const noiseCanvas = document.createElement('canvas');
                noiseCanvas.width = 100; noiseCanvas.height = 100;
                const nCtx = noiseCanvas.getContext('2d');
                const imgData = nCtx.createImageData(100, 100);
                for(let i=0; i<imgData.data.length; i+=4) {
                   const val = Math.random() * 255;
                   imgData.data[i] = val; imgData.data[i+1] = val; imgData.data[i+2] = val;
                   imgData.data[i+3] = 40; 
                }
                nCtx.putImageData(imgData, 0, 0);
                ctx.save();
                ctx.globalAlpha = filters.noise / 100;
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = ctx.createPattern(noiseCanvas, 'repeat');
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
              }
              
              const finalFileName = fileName ? fileName.replace(/\.[^/.]+$/, "") : "photo";
              
              try {
                canvas.toBlob((blob) => {
                  if (!blob) {
                    setAlertMsg("หน่วยความจำไม่พอจัดการรูปนี้ ลองใช้รูปที่ขนาดเล็กลงดูครับ");
                    return;
                  }
                  const url = URL.createObjectURL(blob);
                  const link = document.createElement('a');
                  link.download = `${finalFileName}_PRO.png`;
                  link.href = url;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  setTimeout(() => URL.revokeObjectURL(url), 150);
                }, 'image/png');
              } catch (err) {
                setAlertMsg("เกิดข้อผิดพลาดในการเซฟรูปบนอุปกรณ์นี้: " + err.message);
              }
            };
            img.src = imageSrc;
          };

          const handleCanvasClick = (e) => {
            if (e.target === previewRef.current || e.target.tagName === 'IMG') {
              setActiveSticker(null);
            }
          };

          // =============================================================
          // RENDER UI
          // =============================================================

                              <button onClick={() => { takeSnapshot(); setTransform(p => ({ ...p, flipX: p.flipX * -1 })); }} className="p-2 bg-zinc-900 border-2 border-zinc-700 hover:border-pink-500 hover:bg-black text-white flex flex-col items-center">

                    </aside>

                </>

        function ToolButton({ icon, label, active, onClick }) {
          return (
            <button onClick={onClick} className={`flex flex-col items-center justify-center gap-1 p-2 md:p-3 min-w-[70px] md:w-full transition-all border-b-4 md:border-b-0 md:border-r-4 shrink-0

              <div className={active ? 'transform -rotate-6 scale-110' : ''}>{icon}</div>

            </div>
          );

          return (
            <button onClick={onClick} className="py-2 px-3 bg-black border-2 border-zinc-700 text-zinc-300 font-black text-xs uppercase tracking-wider hover:bg-cyan-400 hover:text-black hover:border-white transition-all whitespace-nowrap active:scale-95">
              {label}
            </button>
          );
        }

        function AIFeatureCard({ icon, title, desc, color, onClick }) {
          const shadowColor = color === 'yellow' ? 'hover:shadow-[4px_4px_0px_rgba(234,179,8,1)]' : color === 'cyan' ? 'hover:shadow-[4px_4px_0px_rgba(6,182,212,1)]' : 'hover:shadow-[4px_4px_0px_rgba(236,72,153,1)]';
          return (
            <div onClick={onClick} className={`flex gap-3 p-3 border-4 border-zinc-700 bg-black cursor-pointer transition-transform hover:-translate-y-1 ${shadowColor}`}>
              <div className="w-10 h-10 bg-zinc-900 border-2 border-zinc-700 flex items-center justify-center text-white shrink-0">
                {icon}
              </div>
              <div className="flex flex-col justify-center">
                <h3 className="font-black text-white text-sm uppercase">{title}</h3>
                <p className="text-[10px] font-bold text-zinc-500">{desc}</p>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
